name: Collect daily edition

on:
  schedule:
    # GitHub's own docs: schedule events can be delayed or dropped entirely
    # during high load, and "high load times include the start of every
    # hour." Offsetting to :17 avoids the worst of that, and three spaced
    # entries mean a dropped run still gets caught later the same day.
    # Safe to run more than once a day — the collector just re-collects
    # and overwrites, no duplication risk.
    - cron: "17 5 * * *"
    - cron: "17 11 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Note: this workflow both commits the new edition AND builds/deploys it in
# the same run. A commit pushed here with the default GITHUB_TOKEN would
# NOT trigger deploy.yml's `on: push` — GitHub deliberately suppresses
# workflow-triggered-by-workflow chains to prevent infinite loops. So rather
# than relying on that push to wake up a separate deploy job, this workflow
# deploys itself once the new data is in place.
concurrency:
  group: pages
  # Queue rather than cancel: a newer trigger (e.g. a code push) shouldn't
  # kill this run mid-collection just because it's still going — it should
  # wait its turn so the already-collected data actually gets committed
  # and deployed instead of being thrown away.
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect.mjs

      - name: Commit new edition
        run: |
          git config user.name "manifest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily edition: $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4